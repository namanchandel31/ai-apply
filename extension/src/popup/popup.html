<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OneTap</title>
    <script src="./popup-embedded.js"></script>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="header-brand">
          <svg class="logo" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M20 44C31.0457 44 40 35.0457 40 24C40 12.9543 31.0457 4 20 4C8.95428 4 0 12.9543 0 24C0 35.0457 8.95428 44 20 44ZM26.2393 13.3168C26.543 12.2381 25.4961 11.6001 24.54 12.2813L11.1931 21.7896C10.1562 22.5283 10.3193 24 11.4381 24H14.9527V23.9728H21.8025L16.2212 25.9421L13.7607 34.6832C13.457 35.762 14.5038 36.3999 15.46 35.7187L28.8069 26.2105C29.8438 25.4718 29.6806 24 28.5619 24H23.2321L26.2393 13.3168Z"
              fill="currentColor"
            />
          </svg>
          <span class="wordmark">OneTap</span>
        </div>
        <button id="close-panel" type="button" class="close-btn" aria-label="Close OneTap">
          <svg class="close-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div id="view-loading" class="view">
        <p class="muted">Checking connection…</p>
      </div>

      <div id="view-main" class="view" hidden>
        <p id="disconnected-message" class="connect-message" hidden>
          Please connect this extension with OneTap by opening OneTap and connecting it.
        </p>

        <div id="connected-content">
          <div class="toggle-card">
            <p class="toggle-title">Auto apply</p>
            <p id="toggle-hint" class="toggle-hint">
              Review each email in Applications before sending from your Gmail.
            </p>
            <button
              id="auto-toggle"
              type="button"
              class="warp-toggle"
              role="switch"
              aria-checked="false"
              aria-label="Toggle auto apply"
            >
              <span class="warp-track">
                <span class="warp-thumb"></span>
              </span>
              <span id="toggle-label" class="warp-label">Off</span>
            </button>
          </div>

          <div class="popup-divider" aria-hidden="true"></div>

          <button id="open-applications" type="button" class="btn btn-secondary">
            Open Applications
          </button>
        </div>

        <p id="error" class="error-text" hidden></p>

        <div id="connection-footer" class="connection-footer">
          <button id="connect-extension" type="button" class="btn btn-primary" hidden>
            Connect extension
          </button>
          <div id="connection-status" class="status-row" hidden>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-text">Connected</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
